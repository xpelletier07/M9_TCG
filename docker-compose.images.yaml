services:
  db-init:
    image: curlimages/curl:8.11.1
    command:
      - sh
      - -ec
      - |
        curl -fsSL https://raw.githubusercontent.com/xpelletier07/M9_TCG/main/app/Serveur/db/db.sql -o /initdb/db.sql
    volumes:
      - dbinit:/initdb
    restart: "no"

  client:
    image: ghcr.io/xpelletier07/m9-tcg-client:main-latest
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_started

  server:
    image: ghcr.io/xpelletier07/m9-tcg-api:main-latest
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/m9tcg
      JWT_SECRET: cle-locale-m9tcg
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: m9tcg
    volumes:
      - pgdata:/var/lib/postgresql/data
      - dbinit:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d m9tcg"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  dbinit:

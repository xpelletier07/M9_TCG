name: Docker CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le repo
        uses: actions/checkout@v4

      - name: Construire et démarrer les conteneurs
        run: docker compose up --build -d

      - name: Attendre que le serveur soit prêt
        run: |
          echo "Attente du serveur..."
          for i in {1..15}; do
            if curl -sf http://localhost:3000/health; then
              echo "Serveur prêt !"
              break
            fi
            echo "Tentative $i..."
            sleep 2
          done

      - name: Vérifier l'accès à la base de données
        run: |
          echo "Vérification de la connexion à PostgreSQL..."
          for i in {1..10}; do
            if curl -sf http://localhost:3000/api/db-check; then
              echo "Base de données accessible !"
              break
            fi
            echo "Tentative $i..."
            sleep 2
          done

      - name: Vérifier que le client répond
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:5173; then
              echo "Client prêt !"
              break
            fi
            echo "Tentative $i..."
            sleep 2
          done

      - name: Vérifier l'état des conteneurs
        run: docker compose ps

      - name: Afficher les logs (utile en cas d'échec)
        if: always()
        run: docker compose logs

      - name: Arrêter les conteneurs
        if: always()
        run: docker compose down -v